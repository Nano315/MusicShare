# Publie le site sur GitHub Pages à chaque push sur main.
# Seuls les fichiers du site partent en ligne (pas le dossier server/, qui tourne sur le homelab).
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Garder seulement les fichiers du site
        run: |
          mkdir _site
          cp -r index.html script.js styles.css assets _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploiement
        uses: actions/deploy-pages@v4
