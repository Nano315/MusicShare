# Compose de production — homelab : ~/services/lastlink/
# LastLink : le site et son serveur (chansons + chat) sur https://lastlink.nanodev.app
# (tunnel Cloudflare) + http://homelab:8136. Copie du site : GitHub Pages.
services:
  lastlink:
    build: .
    image: lastlink:local
    container_name: lastlink
    restart: unless-stopped
    environment:
      STATIC_DIR: /srv/site
      # adresses des pages autorisées à écrire : le site lui-même, puis sa copie GitHub Pages
      ALLOWED_ORIGINS: https://lastlink.nanodev.app,http://homelab:8136,https://nano315.github.io
    ports:
      - "8136:8136"           # LAN + Tailscale ; internet via cloudflared (réseau climhub_default)
    volumes:
      - ./data:/data          # lastlink.db (SQLite) : sauvegardé par la sauvegarde nocturne
      - ./site:/srv/site:ro   # le site (index.html, script.js, styles.css, assets/) : mis à jour sans reconstruire l'image
    networks:
      - climhub_default       # cloudflared → http://lastlink:8136
    mem_limit: 128M
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

networks:
  climhub_default:
    external: true
